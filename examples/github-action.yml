# Intended usage after a WASP GitHub Action is published and pinned to a full commit SHA.
name: WASP Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # Replace with full SHA in production
      # Placeholder: action repository/version is not published yet.
      # - uses: <verified-owner>/wasp-action@<full-commit-sha>
      #   with:
      #     target: https://example.com
      #     fail-on: high
      #     min-coverage: '0.85'
