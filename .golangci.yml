version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
issues:
  max-issues-per-linter: 0
  max-same-issues: 0